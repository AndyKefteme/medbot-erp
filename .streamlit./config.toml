[server]
# Вимикаємо моніторинг файлів, щоб Streamlit не перезавантажувався від кожної картинки
fileWatcherType = "none"
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#5865F2"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
